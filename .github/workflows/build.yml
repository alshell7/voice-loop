name: Release Windows and macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py
      - name: Verify packaged Windows UI
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/smoke_packaged.ps1
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: python scripts/build_macos.py
      - name: Verify packaged macOS Qt rendering
        if: runner.os == 'macOS'
        run: dist/VoiceLoop.app/Contents/MacOS/VoiceLoop check-ui --output build/packaged-ui.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-${{ matrix.target }}
          path: |
            dist/*-setup.exe
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Publish a complete release for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          for target in windows-x64-setup.exe macos-arm64.pkg macos-x64.pkg; do
            test -f "release-assets/VoiceLoop-${version}-${target}"
          done
          python3 scripts/build_extension.py
          cp dist/*-chrome.zip dist/*-chrome.zip.sha256 release-assets/
          (cd release-assets && sha256sum --check -- *.sha256)
          python3 scripts/release_notes.py --output release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Voice Loop ${version} · build ${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
