<!doctype html>
<html lang="en"><head><title>Cliq — Test Workspace</title></head><body>
<!-- Representative answered state derived from observed call-wrapper/timer/control
     attributes. It is an explicit test fixture, not a recorded live answered call. -->
<div id="mediacall_container">
  <div class="AV-call-wrapper" mediacallwrapper callid="synthetic-attended" calltype="audio">
    <div class="AV-call-main">
      <span class="username" current-username>You</span>
      <span other-username>Test Attendee</span><span id="mediacallsessiontimer">00:01</span>
      <button mediacallbuttons purpose="endCall" av-tooltip-title="End call">phone</button>
    </div>
    <div initialcontainer style="display:none">
      <span other-username>Hidden Previous Contact</span>
      <div class="AV-call-status AV-call-outgoing"><span statuscontent>Ringing...</span></div>
      <button aria-label="Answer call">Answer call</button>
    </div>
  </div>
</div>
</body></html>
