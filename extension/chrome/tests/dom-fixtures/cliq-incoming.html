<!doctype html>
<html lang="en"><head><title>Cliq — Test Workspace</title></head><body>
<!-- Representative incoming structure derived from observed Cliq call attributes;
     incoming attendance has not been captured in an authenticated live test. -->
<main id="chat-window"><span class="username">Unrelated Chat Contact</span><time>12:30</time></main>
<div id="mediacall_container">
  <div class="AV-call-wrapper AV-call-initial" mediacallwrapper callid="synthetic-incoming" calltype="audio" callerid="synthetic-caller" calleeid="synthetic-self">
    <div class="AV-call-main" style="display:none">
      <span other-username>Hidden Previous Caller</span><span id="mediacallsessiontimer">00:49</span>
      <button mediacallbuttons purpose="endCall" av-tooltip-title="End call">phone</button>
    </div>
    <div initialcontainer>
      <span other-username>Test Caller</span>
      <div class="AV-call-status AV-call-incoming"><span statuscontent>Incoming audio call</span></div>
      <button mediacallbuttons purpose="acceptCall" aria-label="Answer call">Answer call</button>
      <button mediacallbuttons purpose="rejectCall" aria-label="Decline call">Decline call</button>
    </div>
  </div>
</div>
</body></html>
